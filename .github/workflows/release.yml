name: Release Build (Manual Trigger)

# This workflow builds Evoris release bundles for Windows and Linux.
# STRICT REQUIREMENT: Runs ONLY when manually triggered via the GitHub Actions UI ("Run workflow" button).
# It will NEVER trigger automatically on git push, pull request, or commit.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v0.1.0). Leave empty to use version from package.json'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Release Title (e.g., Evoris v0.1.0). Leave empty for default title'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Release Notes / Description (e.g., What is new in this release)'
        required: false
        default: 'See commit history and changelog for release details.'
        type: string
      is_draft:
        description: 'Publish as Draft Release'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build ${{ matrix.name }} Bundles
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Runner: Builds .msi (WiX) and .exe (NSIS installer)
          - platform: windows-latest
            name: Windows
            target_bundles: '--bundles msi,nsis'
            artifact_name: evoris-windows-binaries

          # Linux Runner: Builds .deb (Debian/Ubuntu), .rpm (Fedora/RHEL), and .AppImage (Universal)
          - platform: ubuntu-22.04
            name: Linux
            target_bundles: '--bundles deb,appimage,rpm'
            artifact_name: evoris-linux-binaries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux System & Packaging Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            squashfs-tools \
            rpm
        shell: bash

      - name: Resolve Release Version & Metadata
        id: release_meta
        run: |
          # Read version from package.json if release_tag input was not specified
          APP_VERSION=$(node -p "require('./package.json').version")
          
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v$APP_VERSION"
          fi
          
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            NAME="${{ github.event.inputs.release_name }}"
          else
            NAME="Evoris $TAG"
          fi

          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            BODY="${{ github.event.inputs.release_notes }}"
          else
            BODY="Release of Evoris $TAG. See commit history for full details."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Application & Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: ${{ steps.release_meta.outputs.body }}
          releaseDraft: ${{ github.event.inputs.is_draft }}
          prerelease: ${{ github.event.inputs.is_prerelease }}
          args: ${{ matrix.target_bundles }}

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14
